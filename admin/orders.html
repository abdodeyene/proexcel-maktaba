<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commandes – ProExcel Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div style="font-size:1.5rem">📚</div>
      <div>
        <div class="sidebar-logo-text">Pro<span>Excel</span></div>
        <div style="font-size:0.62rem;color:rgba(255,255,255,0.3);margin-top:1px">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principale</div>
      <a href="index.html" class="sidebar-link"><span class="sl-icon">📊</span> Dashboard</a>
      <a href="products.html" class="sidebar-link"><span class="sl-icon">📦</span> Produits</a>
      <a href="orders.html" class="sidebar-link active"><span class="sl-icon">🛒</span> Commandes</a>
      <a href="categories.html" class="sidebar-link"><span class="sl-icon">🗂️</span> Catégories</a>
      <div class="sidebar-section-label">Configuration</div>
      <a href="settings.html" class="sidebar-link"><span class="sl-icon">⚙️</span> Paramètres</a>
      <a href="../index.html" class="sidebar-link" target="_blank"><span class="sl-icon">🌐</span> Voir la boutique</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-admin">
        <div class="sidebar-avatar">A</div>
        <div>
          <div class="sidebar-admin-name">Admin ProExcel</div>
          <div class="sidebar-admin-role">Super Admin</div>
        </div>
      </div>
      <button class="sidebar-theme-btn">🌙 Mode sombre</button>
      <button class="sidebar-logout" onclick="adminLogout()">🚪 Déconnexion</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-title">Commandes <span id="ordersCountBadge"></span></div>
      <div class="topbar-actions">
        <button class="btn-action" onclick="exportOrders()">📤 Exporter CSV</button>
        <button class="btn-action btn-action-red" onclick="clearAllOrders()" style="margin-left:0.5rem">🗑️ Vider tout</button>
      </div>
    </div>

    <!-- Status tabs -->
    <div style="display:flex;gap:0;padding:0 1.5rem;background:var(--a-card);border-bottom:1px solid var(--a-border);overflow-x:auto">
      <button class="order-tab active" data-status="all" onclick="filterByStatus('all',this)">Toutes</button>
      <button class="order-tab" data-status="pending" onclick="filterByStatus('pending',this)">En attente</button>
      <button class="order-tab" data-status="processing" onclick="filterByStatus('processing',this)">En cours</button>
      <button class="order-tab" data-status="shipped" onclick="filterByStatus('shipped',this)">Expédiées</button>
      <button class="order-tab" data-status="completed" onclick="filterByStatus('completed',this)">Complétées</button>
      <button class="order-tab" data-status="cancelled" onclick="filterByStatus('cancelled',this)">Annulées</button>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <input class="filter-input" id="orderSearch" placeholder="🔍 Rechercher par nom, ID, ville…" oninput="renderOrders()">
      <select class="filter-select" id="orderCity" onchange="renderOrders()">
        <option value="">Toutes les villes</option>
        <option>Casablanca</option><option>Rabat</option><option>Fès</option>
        <option>Marrakech</option><option>Agadir</option><option>Tanger</option>
        <option>Meknès</option><option>Oujda</option>
      </select>
      <select class="filter-select" id="orderSort" onchange="renderOrders()">
        <option value="date-desc">Plus récentes</option>
        <option value="date-asc">Plus anciennes</option>
        <option value="amount-desc">Montant décroissant</option>
        <option value="amount-asc">Montant croissant</option>
      </select>
      <span style="font-size:0.82rem;color:var(--a-text2);margin-left:auto" id="filteredCount"></span>
    </div>

    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;padding:1.25rem 1.5rem;border-bottom:1px solid var(--a-border)" id="orderSummary"></div>

    <!-- Bulk action bar -->
    <div id="bulkBar" style="display:none;position:sticky;top:0;z-index:50;background:var(--a-primary);color:#fff;padding:0.75rem 1.5rem;display:none;align-items:center;gap:1rem;box-shadow:0 4px 16px rgba(37,99,235,0.3)">
      <span id="bulkCount" style="font-weight:700;font-size:0.9rem"></span>
      <button onclick="deleteSelected()" style="padding:0.45rem 1.1rem;background:#fff;color:var(--a-red);border:none;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer">🗑️ Supprimer la sélection</button>
      <button onclick="clearSelection()" style="padding:0.45rem 1rem;background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer">✕ Annuler</button>
    </div>

    <!-- Orders Table -->
    <div class="a-card" style="margin:1.5rem;border-radius:var(--a-r);overflow:hidden">
      <div class="a-table-wrap">
        <table class="a-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" onchange="toggleAll(this)" style="accent-color:var(--a-primary)"></th>
              <th>Commande</th>
              <th>Client</th>
              <th>Produit(s)</th>
              <th>Date</th>
              <th>Montant</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:1rem 1.5rem 2rem" id="pagination"></div>
  </main>
</div>

<!-- ORDER DETAIL MODAL -->
<div id="orderModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem">
  <div style="background:var(--a-card);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.3)">
    <div style="padding:1.5rem;border-bottom:1px solid var(--a-border);display:flex;align-items:center;justify-content:space-between">
      <h2 style="font-size:1.1rem;font-weight:700" id="modalTitle">Commande #</h2>
      <button onclick="closeModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--a-text2)">✕</button>
    </div>
    <div id="modalContent" style="padding:1.5rem"></div>
  </div>
</div>

<style>
.order-tab {
  padding: 0.85rem 1.25rem; background: none; border: none; border-bottom: 2px solid transparent;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.25s;
  color: var(--a-text2); font-family: inherit; white-space: nowrap; flex-shrink: 0;
}
.order-tab:hover { color: var(--a-text); }
.order-tab.active { color: var(--a-primary); border-bottom-color: var(--a-primary); }
.page-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--a-border);
  background: var(--a-card); color: var(--a-text2); font-size: 0.82rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.page-btn:hover, .page-btn.active { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
</style>

<script src="../store.js"></script>
<script src="admin.js"></script>
<script>
let currentStatus = 'all';
let currentPage = 1;
const PAGE_SIZE = 15;

function filterByStatus(status, btn) {
  currentStatus = status;
  currentPage = 1;
  document.querySelectorAll('.order-tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
  renderOrders();
}

function getFilteredOrders() {
  const orders = getOrders();
  const q = document.getElementById('orderSearch')?.value?.toLowerCase() || '';
  const city = document.getElementById('orderCity')?.value || '';
  const sort = document.getElementById('orderSort')?.value || 'date-desc';

  let filtered = orders.filter(o => {
    if (currentStatus !== 'all' && o.status !== currentStatus) return false;
    if (q && !o.name?.toLowerCase().includes(q) && !o.orderNum?.toLowerCase().includes(q) && !o.city?.toLowerCase().includes(q)) return false;
    if (city && o.city !== city) return false;
    return true;
  });

  if (sort === 'date-desc') filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
  else if (sort === 'date-asc') filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
  else if (sort === 'amount-desc') filtered.sort((a, b) => b.total - a.total);
  else if (sort === 'amount-asc') filtered.sort((a, b) => a.total - b.total);
  return filtered;
}

function renderOrders() {
  const filtered = getFilteredOrders();
  document.getElementById('filteredCount').textContent = `${filtered.length} commande${filtered.length!==1?'s':''}`;

  // Summary cards
  const all = getOrders();
  const sumCards = [
    { label: 'Total', val: all.length, color: 'var(--a-primary)', icon: '📦' },
    { label: 'En attente', val: all.filter(o=>o.status==='pending').length, color: 'var(--a-yellow)', icon: '⏳' },
    { label: 'En cours', val: all.filter(o=>o.status==='processing').length, color: 'var(--a-orange)', icon: '⚙️' },
    { label: 'Complétées', val: all.filter(o=>o.status==='completed').length, color: 'var(--a-green)', icon: '✅' },
    { label: 'Revenus', val: all.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+o.total,0).toLocaleString()+' DH', color: 'var(--a-primary)', icon: '💰' },
  ];
  document.getElementById('orderSummary').innerHTML = sumCards.map(c =>
    `<div style="background:var(--a-card);border:1.5px solid var(--a-border);border-radius:10px;padding:1rem;text-align:center">
      <div style="font-size:1.4rem">${c.icon}</div>
      <div style="font-size:1.2rem;font-weight:800;color:${c.color};margin-top:0.3rem">${c.val}</div>
      <div style="font-size:0.72rem;color:var(--a-text2);margin-top:0.15rem">${c.label}</div>
    </div>`
  ).join('');

  // Pagination
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const pageItems = filtered.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  // Table
  const tbody = document.getElementById('ordersTbody');
  if (pageItems.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--a-text2)">Aucune commande trouvée</td></tr>`;
  } else {
    tbody.innerHTML = pageItems.map(o => {
      const statusClass = { completed:'status-completed', processing:'status-processing', pending:'status-pending', shipped:'status-shipped', cancelled:'status-cancelled' }[o.status] || 'status-pending';
      const statusLabel = { completed:'Complété', processing:'En cours', pending:'En attente', shipped:'Expédié', cancelled:'Annulé' }[o.status] || o.status;
      const d = new Date(o.date);
      const prodNames = o.cart?.map(i => i.title?.substring(0,20)+'…').join(', ') || '–';
      return `<tr>
        <td><input type="checkbox" class="order-cb" data-num="${o.orderNum}" onchange="updateBulkBar()" style="accent-color:var(--a-primary)"></td>
        <td><span class="order-id">#${o.orderNum}</span></td>
        <td>
          <div class="cust-name">${o.name || '–'}</div>
          <div style="font-size:0.72rem;color:var(--a-text2)">${o.phone || ''} · ${o.city || ''}</div>
        </td>
        <td style="font-size:0.78rem;color:var(--a-text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${prodNames}</td>
        <td style="color:var(--a-text2);font-size:0.8rem">${d.toLocaleDateString('fr-FR')}<br><span style="font-size:0.72rem">${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></td>
        <td><span class="order-amount">${o.total} DH</span></td>
        <td>
          <select onchange="changeStatus('${o.orderNum}',this.value)" style="padding:0.25rem 0.5rem;border-radius:7px;border:1.5px solid var(--a-border);background:transparent;color:var(--a-text);font-size:0.75rem;cursor:pointer;font-family:inherit">
            <option value="pending" ${o.status==='pending'?'selected':''}>En attente</option>
            <option value="processing" ${o.status==='processing'?'selected':''}>En cours</option>
            <option value="shipped" ${o.status==='shipped'?'selected':''}>Expédié</option>
            <option value="completed" ${o.status==='completed'?'selected':''}>Complété</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Annulé</option>
          </select>
        </td>
        <td>
          <div style="display:flex;gap:0.35rem">
            <button class="btn-action" onclick="openOrder('${o.orderNum}')">👁️ Voir</button>
            <button class="btn-action btn-action-red" onclick="deleteOrder('${o.orderNum}')">🗑️</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // Pagination buttons
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let pagHTML = '';
  if (currentPage > 1) pagHTML += `<button class="page-btn" onclick="goPage(${currentPage-1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
      pagHTML += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 2) {
      pagHTML += `<span style="color:var(--a-text2);padding:0 0.25rem">…</span>`;
    }
  }
  if (currentPage < totalPages) pagHTML += `<button class="page-btn" onclick="goPage(${currentPage+1})">›</button>`;
  pag.innerHTML = pagHTML;
}

function goPage(p) { currentPage = p; renderOrders(); }

function changeStatus(orderNum, newStatus) {
  const orders = JSON.parse(localStorage.getItem('proexcel_orders') || '[]');
  const o = orders.find(x => x.orderNum === orderNum);
  if (o) {
    o.status = newStatus;
    localStorage.setItem('proexcel_orders', JSON.stringify(orders));
    // Sync avec le backend si l'order a un id
    if (typeof Store !== 'undefined' && o.id) {
      Store.updateOrderStatus(o.id, newStatus).catch(e => console.warn('[Store] updateOrderStatus:', e.message));
    }
  }
  adminToast('✅', 'Statut mis à jour', `Commande #${orderNum} → ${newStatus}`);
}

function openOrder(orderNum) {
  const orders = getOrders();
  const o = orders.find(x => x.orderNum === orderNum);
  if (!o) return;
  document.getElementById('modalTitle').textContent = `Commande #${o.orderNum}`;
  const statusClass = { completed:'status-completed', processing:'status-processing', pending:'status-pending', shipped:'status-shipped', cancelled:'status-cancelled' }[o.status] || 'status-pending';
  const statusLabel = { completed:'Complété', processing:'En cours', pending:'En attente', shipped:'Expédié', cancelled:'Annulé' }[o.status] || o.status;
  document.getElementById('modalContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem">
      <div style="background:var(--a-bg);border-radius:10px;padding:1rem">
        <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--a-text2);margin-bottom:0.5rem">Client</div>
        <div style="font-weight:700">${o.name}</div>
        <div style="font-size:0.82rem;color:var(--a-text2);margin-top:0.25rem">📞 ${o.phone}</div>
        <div style="font-size:0.82rem;color:var(--a-text2);margin-top:0.15rem">📍 ${o.address}, ${o.city}</div>
      </div>
      <div style="background:var(--a-bg);border-radius:10px;padding:1rem">
        <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--a-text2);margin-bottom:0.5rem">Détails</div>
        <div style="font-size:0.82rem">📅 ${new Date(o.date).toLocaleDateString('fr-FR')}</div>
        <div style="margin-top:0.4rem"><span class="status-badge ${statusClass}">● ${statusLabel}</span></div>
      </div>
    </div>
    <div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--a-text2);margin-bottom:0.75rem">Produits commandés</div>
    ${(o.cart || []).map(item => `
      <div style="display:flex;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid var(--a-border);font-size:0.85rem">
        <div>${item.title}</div>
        <div style="color:var(--a-text2)">${item.variant} × ${item.qty}</div>
        <div style="font-weight:700;color:var(--a-primary)">${(item.price * item.qty)} DH</div>
      </div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding:1rem 0 0;font-size:1rem;font-weight:800;border-top:2px solid var(--a-border);margin-top:0.5rem">
      <span>Total</span>
      <span style="color:var(--a-primary)">${o.total} DH</span>
    </div>
    <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
      <button onclick="changeStatus('${o.orderNum}','completed');closeModal()" style="flex:1;padding:0.7rem;background:var(--a-green);color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit">✅ Marquer complété</button>
      <button onclick="changeStatus('${o.orderNum}','cancelled');closeModal()" style="flex:1;padding:0.7rem;background:rgba(220,38,38,0.1);color:var(--a-red);border:1.5px solid rgba(220,38,38,0.2);border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit">❌ Annuler</button>
    </div>`;
  document.getElementById('orderModal').style.display = 'flex';
}

function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
document.getElementById('orderModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function deleteOrder(orderNum) {
  if (!confirm(`Supprimer la commande #${orderNum} ?`)) return;
  let orders = JSON.parse(localStorage.getItem('proexcel_orders') || '[]');
  const target = orders.find(o => o.orderNum === orderNum);
  orders = orders.filter(o => o.orderNum !== orderNum);
  localStorage.setItem('proexcel_orders', JSON.stringify(orders));
  // Sync avec le backend si l'order a un id
  if (typeof Store !== 'undefined' && target?.id) {
    Store.deleteOrder(target.id).catch(e => console.warn('[Store] deleteOrder:', e.message));
  }
  adminToast('🗑️','Commande supprimée', '#' + orderNum);
  renderOrders();
}

function toggleAll(cb) {
  document.querySelectorAll('.order-cb').forEach(c => c.checked = cb.checked);
  updateBulkBar();
}

function updateBulkBar() {
  const checked = document.querySelectorAll('.order-cb:checked');
  const bar = document.getElementById('bulkBar');
  const count = document.getElementById('bulkCount');
  if (checked.length > 0) {
    bar.style.display = 'flex';
    count.textContent = `${checked.length} commande${checked.length > 1 ? 's' : ''} sélectionnée${checked.length > 1 ? 's' : ''}`;
  } else {
    bar.style.display = 'none';
  }
  document.getElementById('selectAll').indeterminate = checked.length > 0 && checked.length < document.querySelectorAll('.order-cb').length;
  document.getElementById('selectAll').checked = checked.length > 0 && checked.length === document.querySelectorAll('.order-cb').length;
}

function clearSelection() {
  document.querySelectorAll('.order-cb').forEach(c => c.checked = false);
  document.getElementById('selectAll').checked = false;
  updateBulkBar();
}

function deleteSelected() {
  const checked = [...document.querySelectorAll('.order-cb:checked')];
  if (checked.length === 0) return;
  if (!confirm(`Supprimer ${checked.length} commande${checked.length > 1 ? 's' : ''} ?`)) return;
  const nums = checked.map(c => c.dataset.num);
  let orders = JSON.parse(localStorage.getItem('proexcel_orders') || '[]');
  const targets = orders.filter(o => nums.includes(o.orderNum));
  orders = orders.filter(o => !nums.includes(o.orderNum));
  localStorage.setItem('proexcel_orders', JSON.stringify(orders));
  // Sync avec le backend
  if (typeof Store !== 'undefined') {
    targets.forEach(o => { if (o.id) Store.deleteOrder(o.id).catch(() => {}); });
  }
  adminToast('🗑️', `${nums.length} commande${nums.length > 1 ? 's' : ''} supprimée${nums.length > 1 ? 's' : ''}`, '');
  clearSelection();
  renderOrders();
}

function exportOrders() {
  const filtered = getFilteredOrders();
  const csv = ['ID,Client,Téléphone,Ville,Total,Date,Statut'].concat(
    filtered.map(o => `${o.orderNum},"${o.name}",${o.phone},"${o.city}",${o.total},${new Date(o.date).toLocaleDateString('fr-FR')},${o.status}`)
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'commandes.csv'; a.click();
  URL.revokeObjectURL(url);
  adminToast('📤','Export CSV','Fichier téléchargé!');
}

document.addEventListener('DOMContentLoaded', () => {
  const orderParam = new URLSearchParams(location.search).get('order');

  // One-time: remove auto-generated mock orders
  if (!localStorage.getItem('proexcel_orders_cleaned')) {
    let orders = JSON.parse(localStorage.getItem('proexcel_orders') || '[]');
    orders = orders.filter(o => !/^PE10\d{4}$/.test(o.orderNum));
    localStorage.setItem('proexcel_orders', JSON.stringify(orders));
    localStorage.setItem('proexcel_orders_cleaned', '1');
  }

  const total = getOrders().length;
  document.getElementById('ordersCountBadge').textContent = `${total} commande${total!==1?'s':''}`;
  renderOrders();
  if (orderParam) setTimeout(() => openOrder(orderParam), 150);

  // Charger les commandes depuis l'API et mettre à jour localStorage
  if (typeof Store !== 'undefined') {
    Store.fetchOrders().then(data => {
      const apiOrders = (data?.items || data || []).map(o => ({
        id: o.id,
        orderNum: o.orderNum,
        name: o.name,
        phone: o.phone,
        address: o.address,
        city: o.city,
        total: o.total,
        status: o.status,
        cart: o.cart || [],
        date: o.date,
      }));
      if (apiOrders.length) {
        localStorage.setItem('proexcel_orders', JSON.stringify(apiOrders));
        const t = apiOrders.length;
        document.getElementById('ordersCountBadge').textContent = `${t} commande${t!==1?'s':''}`;
        renderOrders();
      }
    }).catch(() => {});
  }
});
</script>
</body>
</html>
