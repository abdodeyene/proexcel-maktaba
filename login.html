<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – ProExcel Maktaba</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function(){
      var t=localStorage.getItem('proexcel_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('proexcel_lang')||'fr';
      document.documentElement.lang=l;
      document.documentElement.dir=l==='ar'?'rtl':'ltr';
    })();
  </script>
  <style>
    /* ── LOGIN PAGE FULL REDESIGN ── */
    body { margin:0; padding:0; min-height:100vh; }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #060a1a 0%, #0d1b3e 30%, #1a0a3c 60%, #060a1a 100%);
    }

    /* Animated background blobs */
    .login-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      animation: blobFloat 10s ease-in-out infinite;
    }
    .login-blob-1 {
      width: 500px; height: 500px;
      top: -150px; left: -100px;
      background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .login-blob-2 {
      width: 450px; height: 450px;
      bottom: -120px; right: -80px;
      background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%);
      animation-delay: -4s;
    }
    .login-blob-3 {
      width: 300px; height: 300px;
      top: 40%; left: 55%;
      background: radial-gradient(circle, rgba(96,165,250,0.12) 0%, transparent 70%);
      animation-delay: -7s;
    }
    @keyframes blobFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Decorative book shelf at bottom */
    .login-shelf {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: flex-end;
      padding: 0 5%;
      gap: 4px;
      height: 120px;
      opacity: 0.08;
      pointer-events: none;
    }
    .login-shelf-book {
      border-radius: 3px 5px 0 0;
      flex-shrink: 0;
    }

    /* Centered glass card */
    .login-glass-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 1.5rem;
      animation: loginCardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes loginCardIn {
      from { opacity:0; transform: translateY(30px) scale(0.95); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }
    .login-glass-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 24px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* Logo area */
    .lg-logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .lg-logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .lg-logo-text span { color: #60a5fa; }
    .lg-tagline {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.2rem;
      letter-spacing: 1px;
    }
    .lg-logo img {
      max-height: 72px;
      max-width: 180px;
      object-fit: contain;
      border-radius: 10px;
    }

    /* Tabs */
    .lg-tabs {
      display: flex;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.75rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .lg-tab {
      flex: 1;
      padding: 0.55rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }
    .lg-tab.active {
      background: rgba(59,130,246,0.9);
      color: #fff;
      box-shadow: 0 4px 16px rgba(59,130,246,0.4);
    }
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    /* Fields */
    .lg-field { margin-bottom: 1.1rem; }
    .lg-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }
    .lg-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s;
      font-family: inherit;
      box-sizing: border-box;
    }
    .lg-input:focus {
      border-color: rgba(96,165,250,0.7);
      background: rgba(59,130,246,0.1);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .lg-input::placeholder { color: rgba(255,255,255,0.28); }

    .lg-forgot {
      text-align: right;
      margin-top: -0.75rem;
      margin-bottom: 1rem;
    }
    .lg-forgot a {
      font-size: 0.78rem;
      color: #60a5fa;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .lg-forgot a:hover { opacity: 1; }

    .lg-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.5px;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    }
    .lg-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(37,99,235,0.5);
    }
    .lg-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .lg-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0;
      color: rgba(255,255,255,0.25);
      font-size: 0.8rem;
    }
    .lg-divider::before, .lg-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .lg-back {
      text-align: center;
      margin-top: 1.25rem;
    }
    .lg-back a {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .lg-back a:hover { color: rgba(255,255,255,0.75); }

    /* Stats strip */
    .lg-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .lg-stat { text-align: center; }
    .lg-stat-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: #60a5fa;
    }
    .lg-stat-lbl {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 0.15rem;
    }
  </style>
</head>
<body>

<div class="login-page">

  <!-- Background blobs -->
  <div class="login-blob login-blob-1"></div>
  <div class="login-blob login-blob-2"></div>
  <div class="login-blob login-blob-3"></div>

  <!-- Decorative book shelf -->
  <div class="login-shelf" id="loginShelf"></div>

  <!-- Glass login card -->
  <div class="login-glass-wrap">
    <div class="login-glass-card">

      <!-- Logo -->
      <div class="lg-logo">
        <div id="storeLogoWrap" style="display:none;justify-content:center;margin-bottom:0.5rem">
          <img id="storeLogoImg" src="" alt="Logo">
        </div>
        <div id="storeLogoFallback">
          <div class="lg-logo-text">Pro<span>Excel</span></div>
          <div class="lg-tagline">Votre Maktaba · مكتبتك</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="lg-tabs">
        <button class="lg-tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
        <button class="lg-tab" id="tab-register" onclick="switchTab('register')">S'inscrire</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panelLogin">
        <form onsubmit="handleLogin(event)">
          <div class="lg-field">
            <label class="lg-label">Email</label>
            <input id="loginEmail" class="lg-input" type="email" placeholder="votre@email.com" autocomplete="email" required>
          </div>
          <div class="lg-field">
            <label class="lg-label">Mot de passe</label>
            <input id="loginPassword" class="lg-input" type="password" placeholder="••••••••••" autocomplete="current-password" required>
          </div>
          <div class="lg-forgot"><a href="#">Mot de passe oublié ?</a></div>
          <button type="submit" class="lg-btn" id="loginBtn">SE CONNECTER</button>
        </form>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panelRegister">
        <form onsubmit="handleRegister(event)">
          <div class="lg-field">
            <label class="lg-label">Nom complet</label>
            <input id="regName" class="lg-input" type="text" placeholder="Votre nom et prénom" required>
          </div>
          <div class="lg-field">
            <label class="lg-label">Email</label>
            <input id="regEmail" class="lg-input" type="email" placeholder="votre@email.com" required>
          </div>
          <div class="lg-field">
            <label class="lg-label">Mot de passe</label>
            <input id="regPassword" class="lg-input" type="password" placeholder="••••••••" required minlength="6">
          </div>
          <div class="lg-field">
            <label class="lg-label">Confirmer le mot de passe</label>
            <input id="regPassword2" class="lg-input" type="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="lg-btn" id="registerBtn">CRÉER MON COMPTE</button>
        </form>
      </div>

      <!-- Stats -->
      <div class="lg-stats">
        <div class="lg-stat">
          <div class="lg-stat-num">1200+</div>
          <div class="lg-stat-lbl">Titres</div>
        </div>
        <div class="lg-stat">
          <div class="lg-stat-num">15K+</div>
          <div class="lg-stat-lbl">Élèves</div>
        </div>
        <div class="lg-stat">
          <div class="lg-stat-num">10+</div>
          <div class="lg-stat-lbl">Années</div>
        </div>
      </div>

      <!-- Back to store -->
      <div class="lg-back">
        <a href="index.html">← Retour à la boutique</a>
      </div>

    </div>
  </div>

</div>

<script src="store.js"></script>
<script src="script.js"></script>
<script>
  // Load saved logo
  (function(){
    const settings = JSON.parse(localStorage.getItem('proexcel_settings') || '{}');
    if (settings.logoBase64) {
      document.getElementById('storeLogoImg').src = settings.logoBase64;
      document.getElementById('storeLogoWrap').style.display = 'flex';
      document.getElementById('storeLogoFallback').style.display = 'none';
    }
  })();

  // Decorative book shelf
  (function(){
    const shelf = document.getElementById('loginShelf');
    if (!shelf) return;
    const colors = [
      ['#1e40af','#3b82f6'],['#7c3aed','#a78bfa'],['#065f46','#10b981'],
      ['#9d174d','#ec4899'],['#92400e','#f59e0b'],['#1e3a5f','#60a5fa'],
      ['#312e81','#818cf8'],['#14532d','#4ade80'],['#7f1d1d','#f87171'],
      ['#1a1a2e','#8b5cf6'],['#0f172a','#38bdf8'],['#134e4a','#2dd4bf'],
      ['#1e1b4b','#a5b4fc'],['#78350f','#fbbf24'],['#1c1917','#a8a29e'],
      ['#1e40af','#3b82f6'],['#7c3aed','#a78bfa'],['#065f46','#10b981'],
      ['#9d174d','#ec4899'],['#92400e','#f59e0b'],
    ];
    for (let i = 0; i < 40; i++) {
      const c = colors[i % colors.length];
      const w = Math.floor(Math.random() * 22) + 16;
      const h = Math.floor(Math.random() * 70) + 60;
      const div = document.createElement('div');
      div.className = 'login-shelf-book';
      div.style.cssText = `width:${w}px;height:${h}px;background:linear-gradient(180deg,${c[0]},${c[1]});flex-shrink:0`;
      shelf.appendChild(div);
    }
  })();

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
    document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    btn.textContent = '⏳ Connexion...';
    btn.disabled = true;

    // 1. Tentative connexion admin via l'API backend (JWT)
    if (typeof Store !== 'undefined') {
      try {
        await Store.adminLogin(email, password);
        showLoginToast('✅', 'Bienvenue Admin!', 'Redirection vers le tableau de bord...');
        setTimeout(() => location.href = 'admin/index.html', 1200);
        return;
      } catch (err) {
        if (err.status === 401) {
          // Mauvais mot de passe admin → montrer erreur directement
          showLoginToast('❌', 'Erreur', 'Email ou mot de passe incorrect.');
          btn.textContent = 'SE CONNECTER';
          btn.disabled = false;
          return;
        }
        // Autre erreur (réseau down) → essayer compte client local
        console.warn('[Store] Backend indisponible, vérification locale...');
      }
    }

    // 2. Fallback: compte client local (si backend down)
    const accounts = JSON.parse(localStorage.getItem('proexcel_accounts') || '[]');
    const found = accounts.find(a => a.email === email && a.password === password);
    if (found) {
      localStorage.setItem('proexcel_user', JSON.stringify({ email: found.email, name: found.name }));
      showLoginToast('✅', 'Connecté!', `Bienvenue ${found.name}!`);
      setTimeout(() => location.href = 'index.html', 1200);
    } else {
      showLoginToast('❌', 'Erreur', 'Email ou mot de passe incorrect.');
      btn.textContent = 'SE CONNECTER';
      btn.disabled = false;
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const btn = document.getElementById('registerBtn');
    if (password !== password2) { showLoginToast('❌', 'Erreur', 'Les mots de passe ne correspondent pas.'); return; }
    const accounts = JSON.parse(localStorage.getItem('proexcel_accounts') || '[]');
    if (accounts.find(a => a.email === email)) { showLoginToast('❌', 'Erreur', 'Cet email est déjà utilisé.'); return; }
    btn.textContent = '⏳ Création...';
    btn.disabled = true;
    setTimeout(() => {
      accounts.push({ name, email, password, date: new Date().toISOString() });
      localStorage.setItem('proexcel_accounts', JSON.stringify(accounts));
      localStorage.setItem('proexcel_user', JSON.stringify({ email, name }));
      showLoginToast('✅', 'Compte créé!', `Bienvenue ${name}!`);
      setTimeout(() => location.href = 'index.html', 1200);
    }, 900);
  }

  function showLoginToast(icon, title, msg) {
    let t = document.getElementById('lgToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'lgToast';
      t.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:rgba(15,23,42,0.9);backdrop-filter:blur(20px);border:1px solid rgba(59,130,246,0.3);border-radius:14px;padding:1rem 1.4rem;display:flex;align-items:center;gap:0.85rem;z-index:9999;transform:translateX(130%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);max-width:320px;color:#eef0f5;box-shadow:0 8px 32px rgba(0,0,0,0.5);font-family:Inter,sans-serif';
      t.innerHTML = '<span id="lgTIcon" style="font-size:1.4rem"></span><div><div id="lgTTitle" style="font-weight:700;font-size:0.88rem;margin-bottom:0.15rem"></div><div id="lgTMsg" style="font-size:0.78rem;opacity:0.7"></div></div>';
      document.body.appendChild(t);
    }
    document.getElementById('lgTIcon').textContent = icon;
    document.getElementById('lgTTitle').textContent = title;
    document.getElementById('lgTMsg').textContent = msg;
    t.style.transform = 'translateX(0)';
    clearTimeout(t._t);
    t._t = setTimeout(() => t.style.transform = 'translateX(130%)', 3200);
  }
</script>
</body>
</html>
